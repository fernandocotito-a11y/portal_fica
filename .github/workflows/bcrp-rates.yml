name: Actualizar tipo de cambio SUNAT / SBS

# Descarga el tipo de cambio oficial SBS (Compra y Venta) vía API del BCRP
# y actualiza `data/tc-bcrp.json` cubriendo todos los días del calendario según SUNAT.
# El portal lee ese archivo desde el mismo dominio (GitHub Pages), sin problemas de CORS.

on:
  schedule:
    # 11:30 UTC = 06:30 en Lima (UTC-5), de lunes a viernes
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bcrp-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar tasas oficiales SBS y regenerar el archivo
        run: node scripts/build-bcrp.js 3

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tc-bcrp.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el tipo de cambio."
            exit 0
          fi
          git commit -m "Actualizar tipo de cambio SUNAT / SBS ($(date -u +%Y-%m-%d))"
          git push
